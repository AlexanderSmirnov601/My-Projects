# Configuration for nuclide_chart_viewer.py.
#
# The read-only account's password is not stored here: set
# ISOTOPEDB_GUEST_PASSWORD in the environment, or you will be prompted for it.
# The account itself is created by "isotope-database-builder/build_isotope_db.py".

[database]
host     = 34.67.94.150
user     = guest
database = IsotopeDB

[paths]
# Where the generated figures are written (relative to this file).
results_dir = Results

[view]
# Isotope pre-filled in the search box on start-up.
default_isotope = 81Ga
# Initial activity used for the decay-chain activity plot, in becquerel.
initial_activity = 1E+9
