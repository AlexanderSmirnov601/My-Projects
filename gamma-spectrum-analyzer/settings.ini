# Configuration for analyze_spectrum.py
#
# Paths are relative to this file unless absolute. A settings.local.ini beside
# this file overrides it and is gitignored.

[paths]
spectrum_file = test_spectrum.Spe
gamma_library = gamma_library.txt
report_file   = report.txt
# Ortec/Maestro writes headers in the acquisition PC's ANSI codepage.
encoding = cp1251

[spectrum]
# How to build the energy axis:
#   file   - use the $MCA_CAL / $ENER_FIT polynomial stored in the .Spe file
#            (correct for any channel count; preferred)
#   linear - spread energy_max_kev evenly over all channels
calibration    = file
energy_max_kev = 1568.5

[peak_detection]
# The filtered spectrum is zeroed wherever it falls below
#   max(filtered) / sensitivity * factor
# Bands are "low_keV:high_keV:factor"; factor 0 discards the band outright and
# an empty high bound means "to the end of the spectrum". Channels outside every
# band are discarded.
sensitivity = 120
bands =
    0:82:0
    82:383:2.0
    383:766:1.0
    766:958:0.65
    958:1533:0.25
    1533::0

# Half-width of the window used to match a measured peak to a library line.
match_tolerance_kev = 0.9325
# Library entries above this mass number are ignored (transuranics).
max_mass_number = 236

[sample]
# Irradiation start, in the same format as the .Spe $DATE_MEA field.
irradiation_date       = 03/12/2022 11:47:30
irradiation_time_min   = 119
half_life_days         = 20.23
gamma_yield            = 0.0277
count_efficiency       = 0.000443
mass_attenuation_coeff = 0.9782648351706037
sample_half_height     = 0.0
thousands_of_particles = 100

[analysis]
# Peaks (keV) to fit and turn into an activity figure. 140.5 keV is the Tc-99m
# line carried by the bundled test_spectrum.Spe; other strong peaks in it:
#   145, 228, 311, 336, 364, 415, 473, 487, 537, 756, 819, 969
peaks_of_interest = 140

[plot]
# Energy window of the summary spectrum plot.
energy_min_kev = 100
energy_max_kev = 300
# Annotate a peak only if it is taller than max(counts) / label_threshold.
label_threshold = 80
